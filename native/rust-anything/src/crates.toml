# Rust crates for the libraries each source language's code imports. `analyze` reports the
# first entry that matches: `names` match exactly, `prefixes` match the start of the name.
# A library missing here is reported as `unknown`, never guessed. fit: good (a maintained crate
# does the same job), partial (the common case; check the rest), none (keep it in the source
# language).

[[ts]]
names = ["yaml", "js-yaml"]
crates = "saphyr, serde_yaml_ng"
fit = "partial"
note = "Parsing is covered. No crate rewrites YAML while keeping comments and layout."

[[ts]]
names = ["json5"]
crates = "json5"
fit = "good"

[[ts]]
names = ["jsonc-parser"]
crates = "jsonc-parser"
fit = "good"
note = "dprint's crate, with a CST for edits."

[[ts]]
names = ["oxc-parser", "@babel/parser", "acorn", "espree"]
crates = "oxc"
fit = "good"
note = "oxc-parser is already a binding of the Rust crate."

[[ts]]
names = ["typescript"]
