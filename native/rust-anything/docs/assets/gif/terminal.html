<!doctype html>
<!-- The README terminal demo. Every line of output is copied from a real run (paths shortened).
     Render with `node scripts/gifs.mjs`. -->
<html><head><meta charset="utf-8"><style>
  body { margin: 0; background: #0b0d10; }
  .win { width: 1100px; height: 620px; margin: 0; background: #111317; border: 1.5px solid #262a31; border-radius: 14px; overflow: hidden; font: 15.5px/1.55 "JetBrains Mono", monospace; color: #c9ced6; }
  .bar { height: 34px; background: #16191e; border-bottom: 1px solid #262a31; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .title { margin-left: 12px; font: 13px Inter, sans-serif; color: #8b9099; }
  .screen { height: 586px; padding: 16px 20px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  pre { margin: 0; white-space: pre-wrap; font: inherit; }
  .p { color: #3fb950; } .c { color: #f2f2f2; } .m { color: #8b9099; } .o { color: #e8892f; font-weight: 700; } .g { color: #3fb950; } .w { color: #f2f2f2; }
  .cur { background: #c9ced6; color: #111317; }
</style></head><body>
<div class="win"><div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="title">~/x18n — rust-anything</span></div><div class="screen"><pre id="t"></pre></div></div>
<script>
const P = '<span class="p">~/x18n $</span> '
// [kind, text]: cmd lines are typed; out lines appear; pause holds the frame.
const script = [
  ['cmd', 'rust-anything profile . -- node --experimental-strip-types search.ts'],
  ['out', '<span class="m">862 ms in all; 21% of it in the repository\'s own code.</span>'],
  ['out', ''],
  ['out', '<span class="w">fuzzyScore</span>  packages/core/src/fuzzy.ts:2   <span class="o">21% (180 ms)</span>'],
  ['out', ''],
  ['out', 'Called in a loop by `matched`: a call per item would cost more than the'],
  ['out', 'work. Batch it, keeping the items in Rust and using all cores:'],
  ['out', '<span class="o">rust-anything bridge . packages/core/src/fuzzy.ts --batch fuzzyScore:text</span>'],
  ['pause', 22],
  ['cmd', 'rust-anything bridge . packages/core/src/fuzzy.ts --batch fuzzyScore:text'],
  ['out', 'Created rust/fuzzy-rs (Napi) for fuzzyScore'],
  ['out', '<span class="m">  Cargo.toml  src/lib.rs  src/port.rs  index.cjs  src/utf16.rs  ...</span>'],
  ['pause', 10],
  ['cmd', '<span class="m"># port fuzzyScore in src/port.rs (you or your agent), then:</span>', true],
  ['cmd', 'rust-anything gate rust/fuzzy-rs'],
  ['out', '<span class="g">pass</span>  fmt        formatted'],
  ['out', '<span class="g">pass</span>  clippy     no warnings'],
  ['out', '<span class="g">pass</span>  cargo test passed'],
  ['out', '<span class="g">pass</span>  unsafe     0 unsafe uses'],
  ['out', '<span class="g">pass</span>  build      built rust/fuzzy-rs/fuzzy_rs.node'],
  ['out', '<span class="g">pass</span>  behavior   <span class="w">2000/2000 recorded cases match</span>'],
  ['out', '<span class="g">Gate passed.</span>'],
  ['pause', 14],
  ['cmd', 'node --experimental-strip-types bench.ts'],
  ['out', 'same results for 16 queries'],
  ['out', 'TS <span class="w">10.28 ms</span> per query; Rust <span class="o">0.50 ms</span>: <span class="o">20.7x faster</span> than TS'],
  ['pause', 45],
]
// Frames: each typed character of a command is one frame (two characters per frame for long
// lines), each output line one frame.
const frames = []
let done = []
for (const [kind, text, instant] of script) {
  if (kind === 'pause') { for (let i = 0; i < text; i++) frames.push(done.join('\n') + '\n' + P + '<span class="cur"> </span>'); continue }
  if (kind === 'out') { done.push(text); frames.push(done.join('\n')); continue }
  if (instant) { done.push(P + text); frames.push(done.join('\n')); frames.push(done.join('\n')); continue }
  const step = text.length > 40 ? 2 : 1
  for (let i = 0; i <= text.length; i += step) frames.push([...done, P + '<span class="c">' + text.slice(0, i) + '</span><span class="cur"> </span>'].join('\n'))
  for (let i = 0; i < 4; i++) frames.push([...done, P + '<span class="c">' + text + '</span>'].join('\n'))
  done.push(P + '<span class="c">' + text + '</span>')
}
window.frameCount = frames.length
window.render = i => { document.getElementById('t').innerHTML = frames[i] }
render(0)
</script></body></html>
