name: Set up Rust
description: Install the Rust toolchain the vendored Rust crates require, and cache their cargo output.
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: 1.97.0
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          native/rust-anything
          native/fast-anything
