name: Set up Rust
description: Install the Rust toolchain the vendored rust-anything crate requires, and cache its cargo output.
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: 1.97.0
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: native/rust-anything
